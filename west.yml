# West manifest for the FprimeBlvRef RP2350 project.
# Only imports modules required by this project's Zephyr build.

manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  group-filter: [-babblesim, -optional]

  projects:
    - name: zephyr
      repo-path: zephyr
      revision: v4.4.2
      path: zephyr
      west-commands: scripts/west-commands.yml
      import:
        path-prefix: lib/zephyr-workspace
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_rpi_pico
          - picolibc
          - loramac-node

  self:
    path: .